        enable.auto.commit: true
        key.deserializer: org.apache.kafka.common.serialization.UUIDDeserializer
        value.deserializer: io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
        value.deserializer.type: concord.dev.domain.ActCommitted
      act-failed-in:
        connector: smallrye-kafka
        topic: ${kafka.topic.act-failed}
        bootstrap.servers: ${kafka.bootstrap.servers}
        group.id: achan-cognitive
        auto.offset.reset: earliest
        enable.auto.commit: true
        key.deserializer: org.apache.kafka.common.serialization.UUIDDeserializer
        value.deserializer: io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
        value.deserializer.type: concord.dev.domain.ActFailed
      consensus-vote-in:
        connector: smallrye-kafka
        topic: ${kafka.topic.consensus-vote}
        bootstrap.servers: ${kafka.bootstrap.servers}
        group.id: achan-cognitive
        auto.offset.reset: earliest
        enable.auto.commit: true
