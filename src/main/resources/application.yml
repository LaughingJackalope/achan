# Database Configuration
quarkus:
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:achan}
    password: ${DB_PASSWORD:achan}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54320}/${DB_NAME:achan}
      max-size: 20
      min-size: 5

  # Hibernate
  hibernate-orm:
    log:
      sql: ${LOG_SQL:false}

  # Flyway Migration
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true


  # Logging
  log:
    level: INFO
    category:
      "concord.dev":
        level: ${APP_LOG_LEVEL:DEBUG}
    console:
      json:
        enabled: true

  # OpenTelemetry
  otel:
    exporter:
      otlp:
        endpoint: ${OTEL_ENDPOINT:http://localhost:4317}

# Application-specific config
kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic:
    url-crawl-requests: ${KAFKA_TOPIC_URL_CRAWL:url-crawl-requests}
    ai-enrichment-requests: ${KAFKA_TOPIC_AI_ENRICHMENT:ai-enrichment-requests}

# Reactive Messaging (Kafka Consumer/Producer)
mp:
  messaging:
    incoming:
      url-crawl-requests:
        connector: smallrye-kafka
        topic: ${kafka.topic.url-crawl-requests}
        bootstrap.servers: ${kafka.bootstrap.servers}
        group.id: achan-crawler
        auto.offset.reset: earliest
        enable.auto.commit: true
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer

      ai-enrichment-requests:
        connector: smallrye-kafka
        topic: ${kafka.topic.ai-enrichment-requests}
        bootstrap.servers: ${kafka.bootstrap.servers}
        group.id: achan
        auto.offset.reset: earliest
        enable.auto.commit: true
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer

    outgoing:
      url-crawl-out:
        connector: smallrye-kafka
        topic: ${kafka.topic.url-crawl-requests}
        bootstrap.servers: ${kafka.bootstrap.servers}
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: org.apache.kafka.common.serialization.StringSerializer

      ai-enrichment-out:
        connector: smallrye-kafka
        topic: ${kafka.topic.ai-enrichment-requests}
        bootstrap.servers: ${kafka.bootstrap.servers}
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
