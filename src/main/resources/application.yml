        value.deserializer.type: concord.dev.domain.ActProposed
      act-committed-in:
        connector: smallrye-kafka
        topic: ${kafka.topic.act-committed}
        bootstrap.servers: ${kafka.bootstrap.servers}
        group.id: achan-cognitive
