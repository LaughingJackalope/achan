<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AChan WebSocket Response Test Client</title>
    <style>
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #4ec9b0;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 5px;
            padding: 20px;
        }
        .panel h2 {
            color: #569cd6;
            margin-top: 0;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            color: #d4d4d4;
            border-radius: 3px;
            font-family: inherit;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #3c3c3c;
            cursor: not-allowed;
        }
        .log {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            font-size: 12px;
            border-radius: 3px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid transparent;
        }
        .log-entry.info { border-color: #4ec9b0; color: #4ec9b0; }
        .log-entry.success { border-color: #6a9955; color: #6a9955; }
        .log-entry.error { border-color: #f48771; color: #f48771; }
        .log-entry.ws { border-color: #dcdcaa; color: #dcdcaa; }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-weight: bold;
            margin: 10px 0;
        }
        .status.connected { background: #6a9955; color: white; }
        .status.disconnected { background: #f48771; color: white; }
        .status.connecting { background: #dcdcaa; color: #1e1e1e; }
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔌 AChan WebSocket Response Test Client</h1>
    <p>Test real-time cognitive response delivery via WebSocket</p>

    <div class="container">
        <!-- Left Panel: Create Intent -->
        <div class="panel">
            <h2>1. Create Intent</h2>
            <label>
                <strong>Object ID (Thread ID):</strong>
                <input type="text" id="objectId" placeholder="UUID or leave empty for random" />
            </label>
            <label>
                <strong>Query Content:</strong>
                <textarea id="queryContent" rows="4" placeholder="What are the key concepts in quantum computing?">What are the key concepts in quantum computing?</textarea>
            </label>
            <label>
                <strong>Agent ID:</strong>
                <input type="text" id="agentId" value="test-user-agent" />
            </label>
            <button id="createIntentBtn" onclick="createIntent()">Create Intent</button>
            <div id="intentResult"></div>
        </div>

        <!-- Right Panel: WebSocket Subscription -->
        <div class="panel">
            <h2>2. Subscribe to Response</h2>
            <label>
                <strong>Intent ID:</strong>
                <input type="text" id="intentId" placeholder="Paste intentId from step 1" />
            </label>
            <div>
                <strong>Connection Status:</strong>
                <span id="wsStatus" class="status disconnected">Disconnected</span>
            </div>
            <button id="connectBtn" onclick="connectWebSocket()">Connect WebSocket</button>
            <button id="disconnectBtn" onclick="disconnectWebSocket()" disabled>Disconnect</button>
            <button id="pingBtn" onclick="sendPing()" disabled>Send Ping</button>
            <div id="responseResult"></div>
        </div>
    </div>

    <!-- Full Width Log Panel -->
    <div class="panel" style="margin-top: 20px;">
        <h2>Event Log</h2>
        <div id="log" class="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script>
        let ws = null;
        const API_BASE = 'http://localhost:8080';
        const WS_BASE = 'ws://localhost:8080';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function updateStatus(status) {
            const statusEl = document.getElementById('wsStatus');
            statusEl.className = `status ${status}`;
            statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        async function createIntent() {
            const objectId = document.getElementById('objectId').value || crypto.randomUUID();
            const content = document.getElementById('queryContent').value;
            const agentId = document.getElementById('agentId').value;

            if (!content.trim()) {
                log('❌ Query content is required', 'error');
                return;
            }

            log('📤 Creating intent...', 'info');

            try {
                const response = await fetch(`${API_BASE}/v1/responses`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        objectId: objectId,
                        content: content,
                        agentId: agentId
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Intent created: ${data.intentId}`, 'success');

                    // Auto-fill the intentId field
                    document.getElementById('intentId').value = data.intentId;

                    // Display result
                    document.getElementById('intentResult').innerHTML = `
                        <pre style="color: #6a9955;">${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    const error = await response.text();
                    log(`❌ Failed to create intent: ${response.status} ${error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        function connectWebSocket() {
            const intentId = document.getElementById('intentId').value.trim();

            if (!intentId) {
                log('❌ Intent ID is required', 'error');
                return;
            }

            if (ws) {
                log('⚠️ Already connected, disconnecting first...', 'info');
                disconnectWebSocket();
            }

            updateStatus('connecting');
            log(`🔌 Connecting to WebSocket: /v1/responses/subscribe/${intentId}`, 'info');

            try {
                ws = new WebSocket(`${WS_BASE}/v1/responses/subscribe/${intentId}`);

                ws.onopen = () => {
                    log('✅ WebSocket connected!', 'success');
                    updateStatus('connected');
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                    document.getElementById('pingBtn').disabled = false;
                };

                ws.onmessage = (event) => {
                    log(`📨 WebSocket message received`, 'ws');
                    try {
                        const data = JSON.parse(event.data);
                        log(`📦 Message type: ${data.type}`, 'ws');

                        if (data.type === 'subscribed') {
                            log(`⏳ ${data.message}`, 'info');
                        } else if (data.type === 'response') {
                            log(`🎉 RESPONSE RECEIVED for intent ${data.intentId}`, 'success');
                            document.getElementById('responseResult').innerHTML = `
                                <pre style="color: #6a9955;">${JSON.stringify(data, null, 2)}</pre>
                            `;
                        } else if (event.data === 'pong') {
                            log(`🏓 Pong received`, 'ws');
                        } else {
                            log(`📋 Data: ${JSON.stringify(data, null, 2)}`, 'ws');
                        }
                    } catch (e) {
                        // Not JSON, might be plain text like "pong"
                        log(`📋 Text message: ${event.data}`, 'ws');
                    }
                };

                ws.onerror = (error) => {
                    log(`❌ WebSocket error: ${error}`, 'error');
                    updateStatus('disconnected');
                };

                ws.onclose = (event) => {
                    log(`🔌 WebSocket closed: ${event.code} - ${event.reason}`, 'info');
                    updateStatus('disconnected');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                    document.getElementById('pingBtn').disabled = true;
                    ws = null;
                };

            } catch (error) {
                log(`❌ Failed to create WebSocket: ${error.message}`, 'error');
                updateStatus('disconnected');
            }
        }

        function disconnectWebSocket() {
            if (ws) {
                log('🔌 Disconnecting WebSocket...', 'info');
                ws.close(1000, 'User requested disconnect');
            }
        }

        function sendPing() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('🏓 Sending ping...', 'info');
                ws.send('ping');
            } else {
                log('❌ WebSocket not connected', 'error');
            }
        }

        // Initial log
        log('🚀 Test client loaded. Server should be running at localhost:8080', 'info');
    </script>
</body>
</html>
